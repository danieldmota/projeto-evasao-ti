[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "evasao"
version = "0.2.0"
description = "Trancamento de matrícula em cursos de graduação (Censo da Educação Superior/INEP, 2009-2024): pipeline em DuckDB e API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# a API (deploy) só precisa disto; o pipeline de dados fica no extra "pipeline"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "duckdb>=1.1",
]

[project.optional-dependencies]
pipeline = [
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "truststore>=0.9",  # o servidor do INEP envia a cadeia de certificados incompleta
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["evasao"]

[tool.vercel]
entrypoint = "evasao.api:app"

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # Query() como valor padrão é o jeito do FastAPI
]
