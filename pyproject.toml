[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "evasao-ti"
version = "0.1.0"
description = "Pipeline de dados do Censo da Educação Superior (INEP) e API para a plataforma de orientação vocacional e prevenção da evasão em TI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "httpx>=0.27",
    "truststore>=0.9",  # valida TLS com o repositório do SO (INEP envia cadeia incompleta)
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
evasao-ti = "evasao_ti.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evasao_ti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_data: testes que exigem os ZIPs reais do INEP em data/raw (pulados se ausentes)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0913",  # muitos argumentos: aceitável em funções de agregação/filtros da API
    "PLR2004",  # números mágicos em testes/validações
    "RUF001", "RUF002", "RUF003",  # caracteres acentuados em textos em português
    "B008",     # Depends()/Query() em defaults (padrão FastAPI)
    "PLR0917",  # parâmetros posicionais: assinaturas de endpoints FastAPI
    "PLW2901",  # reatribuir variável do laço (chunk = transform(chunk)) é intencional
    "N818",     # nomes de exceção em português/domínio
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PLC0415"]
"src/evasao_ti/cli.py" = ["PLC0415"]  # imports tardios: CLI responde rápido ao --help
"src/evasao_ti/acquisition/http.py" = ["PLC0415"]  # truststore é opcional em tempo de import
"src/evasao_ti/processing/reader.py" = ["PLR0915"]

[tool.ruff.format]
quote-style = "double"
