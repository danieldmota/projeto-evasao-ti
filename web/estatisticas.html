<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231f1b16%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22Georgia,serif%22 font-size=%2216%22 font-style=%22italic%22 fill=%22%23f7f5ef%22 text-anchor=%22middle%22%3ETI%3C/text%3E%3C/svg%3E">
<title>Trancamento no Ensino Superior</title>
<script src="tema.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="page">
  <header class="masthead">
    <a class="brand" href="index.html">Permanência <span>em TI</span></a>
    <nav class="site-nav" aria-label="Seções">
      <a href="index.html">Jornada</a>
      <a href="estatisticas.html" aria-current="page">Dados de trancamento</a>
    </nav>
    <div class="segmented theme-switch" role="group" aria-label="Tema da página">
      <button type="button" data-theme-set="auto" aria-pressed="true" title="Seguir o sistema">Auto</button>
      <button type="button" data-theme-set="light" aria-pressed="false">Claro</button>
      <button type="button" data-theme-set="dark" aria-pressed="false">Escuro</button>
    </div>
  </header>

  <main>
    <div id="erro" class="error" hidden></div>

    <section class="intro rise" aria-live="polite">
      <p class="kicker" id="chapeu">Ensino superior · graduação · Censo INEP</p>
      <h1 id="manchete">Carregando os dados do Censo da Educação Superior…</h1>
      <p class="lead" id="linha-fina">&nbsp;</p>
    </section>

    <div class="toolbar rise" style="--i:1" role="group" aria-label="Filtros dos gráficos">
      <div class="field">
        <span class="field-label" id="rot-periodo">Período</span>
        <div class="range" aria-labelledby="rot-periodo">
          <select id="ano-ini" aria-label="Ano inicial"></select> a
          <select id="ano-fim" aria-label="Ano final"></select>
        </div>
      </div>
      <div class="field">
        <span class="field-label" id="rot-mod">Modalidade</span>
        <div class="segmented" data-filtro="modalidade" role="group" aria-labelledby="rot-mod">
          <button type="button" value="" aria-pressed="true">Todas</button>
          <button type="button" value="presencial" aria-pressed="false">Presencial</button>
          <button type="button" value="ead" aria-pressed="false">EaD</button>
        </div>
      </div>
      <div class="field">
        <span class="field-label" id="rot-rede">Rede</span>
        <div class="segmented" data-filtro="rede" role="group" aria-labelledby="rot-rede">
          <button type="button" value="" aria-pressed="true">Todas</button>
          <button type="button" value="publica" aria-pressed="false">Pública</button>
          <button type="button" value="privada" aria-pressed="false">Privada</button>
        </div>
      </div>
    </div>

    <div id="comparabilidade" class="note" hidden></div>

    <figure class="figure rise" style="--i:2" aria-labelledby="fig1-titulo">
      <figcaption class="fig-head">
        <span class="kicker">Figura 1</span>
        <h2 id="fig1-titulo">Taxa de trancamento por área, ano a ano</h2>
        <p>Matrículas trancadas ÷ (matrículas cursando ou formadas + trancadas). Passe o mouse ou toque no gráfico para ver cada ano.</p>
      </figcaption>
      <ul class="legend" id="legenda"></ul>
      <div class="chart" id="graf-anual"></div>
      <p class="source">Fonte: INEP, microdados do Censo da Educação Superior. Cálculo próprio; não é estatística oficial.</p>
      <details>
        <summary>Ver os dados em tabela</summary>
        <div class="table-wrap" id="tab-anual"></div>
      </details>
    </figure>

    <figure class="figure split rise" style="--i:3" aria-labelledby="fig2-titulo">
      <figcaption class="fig-head">
        <span class="kicker">Figura 2</span>
        <h2 id="fig2-titulo">Consolidado do período</h2>
        <p id="resumo-sub">Soma de todos os anos selecionados (vínculos-ano, não pessoas).</p>
        <p class="takeaway" id="conclusao"></p>
      </figcaption>
      <div>
        <div class="chart" id="graf-resumo"></div>
        <details>
          <summary>Ver os dados em tabela</summary>
          <div class="table-wrap" id="tab-resumo"></div>
        </details>
      </div>
    </figure>

    <section class="notes" aria-labelledby="notas-titulo">
      <h2 id="notas-titulo">Como ler estes números</h2>
      <ol id="notas"></ol>
    </section>
  </main>

  <footer class="site-foot" id="fonte"></footer>
</div>

<script type="module">
import { NOME_AREA, pct, compacto, nf, esc, legendaHTML, graficoLinhas, graficoBarras, tabelaAnual, tabelaResumo, criarApi } from "./graficos.js";

const API = (new URLSearchParams(location.search).get("api") || "/api/v1").replace(/\/$/, "");
const api = criarApi(API);
const $ = id => document.getElementById(id);
const RECORTE = {
  modalidade: { presencial: "cursos presenciais", ead: "cursos a distância" },
  rede: { publica: "rede pública", privada: "rede privada" },
};
const filtros = { modalidade: "", rede: "" };
let anosInfo = [];
let dados = null;

function mostrarErro(e) {
  $("erro").hidden = false;
  $("manchete").textContent = "Os dados não carregaram.";
  $("linha-fina").textContent = "";
  $("erro").innerHTML = `<strong>Não foi possível falar com a API.</strong> ${esc(e.message)}<br>
    Rode <code>python -m evasao api</code> e recarregue a página (endereço usado: <code>${esc(API)}</code>).
    Para outro endereço, use <code>?api=URL</code>.`;
}

async function carregar() {
  if (+$("ano-ini").value > +$("ano-fim").value) $("ano-fim").value = $("ano-ini").value;
  const f = { year_start: $("ano-ini").value, year_end: $("ano-fim").value, ...filtros };
  try {
    const [anual, resumo, total] = await Promise.all([
      api("/statistics/annual", { ...f, group_by: "segmento" }),
      api("/statistics/summary", { ...f, group_by: "segmento" }),
      api("/statistics/annual", { ...f, group_by: "total" }),
    ]);
    $("erro").hidden = true;
    dados = { anual, resumo, total };
    desenhar();
  } catch (e) { mostrarErro(e); }
}

// manchete escrita a partir dos números do recorte escolhido
function escreverManchete(anos) {
  const { anual, total } = dados;
  const primeiro = anos[0], ultimo = anos[anos.length - 1];
  const tiFim = anual.data.find(r => r.ano === ultimo && r.grupo_codigo === "TI");
  const tiIni = anual.data.find(r => r.ano === primeiro && r.grupo_codigo === "TI");
  const media = total.data.find(r => r.ano === ultimo)?.taxa_trancamento;
  const ti = tiFim?.taxa_trancamento;
  const recorte = [RECORTE.modalidade[filtros.modalidade], RECORTE.rede[filtros.rede]].filter(Boolean).join(", ");
  $("chapeu").textContent = `Ensino superior · graduação${recorte ? " · " + recorte : ""} · Censo INEP`;
  if (ti == null) {
    $("manchete").textContent = `Sem dados de TI para ${ultimo} neste recorte.`;
    $("linha-fina").textContent = "";
    return;
  }
  let comp = "";
  if (media != null) {
    comp = Math.abs(ti - media) < 0.005 ? ", praticamente igual à média de todas as áreas"
      : `, ${ti > media ? "acima" : "abaixo"} da média de todas as áreas (${pct(media)})`;
  }
  $("manchete").innerHTML = `Em ${ultimo}, <em class="num">${pct(ti)}</em> dos vínculos em cursos de TI estavam trancados${comp}.`;
  let texto = `São <strong>${compacto(tiFim.trancadas)}</strong> matrículas trancadas em
    <strong>${nf.format((tiFim.matriculas ?? 0) + (tiFim.trancadas ?? 0))}</strong> vínculos de TI.`;
  if (tiIni?.taxa_trancamento != null && primeiro !== ultimo) texto += ` Em ${primeiro}, a taxa era de <strong>${pct(tiIni.taxa_trancamento)}</strong>.`;
  $("linha-fina").innerHTML = texto + " Trancar não é o mesmo que evadir: no Censo do INEP são situações de vínculo diferentes.";
}

function desenhar() {
  const { anual, resumo } = dados;
  const anos = anual.meta.periodo.anos_com_dados;
  if (!anos.length) { $("manchete").textContent = "Sem dados no período selecionado."; return; }
  escreverManchete(anos);
  graficoLinhas($("graf-anual"), anual.data, anos);
  $("tab-anual").innerHTML = tabelaAnual(anual.data, anos);
  graficoBarras($("graf-resumo"), resumo.data);
  $("tab-resumo").innerHTML = tabelaResumo(resumo.data);
  $("resumo-sub").textContent = `Soma de ${anos[0]} a ${anos[anos.length - 1]}: vínculos-ano, não pessoas. TI = cursos da área CINE 06.`;

  const ordem = resumo.data.filter(r => NOME_AREA[r.grupo_codigo] && r.taxa_trancamento != null)
    .sort((a, b) => b.taxa_trancamento - a.taxa_trancamento);
  const pos = ordem.findIndex(r => r.grupo_codigo === "TI") + 1;
  $("conclusao").textContent = pos === 1 ? `No período, TI tem a maior taxa de trancamento entre as ${ordem.length} áreas.`
    : pos > 1 ? `No período, TI fica na ${pos}ª posição entre as ${ordem.length} áreas.` : "";

  const atencao = anosInfo.filter(a => a.comparabilidade === "atencao" && anos.includes(a.ano));
  $("comparabilidade").hidden = !atencao.length;
  $("comparabilidade").innerHTML = atencao.length ? `<details><summary><span class="kicker">Nota</span>
    ${atencao.map(a => a.ano).join(", ")} têm mudanças de coleta ou de classificação. Ver detalhes</summary>
    <ul>${atencao.map(a => `<li><strong>${a.ano}:</strong> ${[...a.notas_curadas, ...a.alertas_automaticos].map(esc).join(" ")}</li>`).join("")}</ul></details>` : "";

  const meta = resumo.meta;
  $("notas").innerHTML = [
    "<strong>Unidade:</strong> vínculos aluno–curso no ano. Um mesmo estudante aparece em cada ano em que está vinculado; os números não contam pessoas.",
    "<strong>Taxa de trancamento</strong> = matrículas trancadas ÷ (matrículas cursando ou formadas + trancadas). No Censo, matrícula trancada e aluno desvinculado do curso são situações de vínculo diferentes.",
    "<strong>TI</strong> = cursos da área geral 06 da CINE Brasil/INEP (Computação e Tecnologias da Informação e Comunicação). Licenciaturas em Computação ficam na área de Educação.",
    ...meta.avisos.filter(a => !a.startsWith("Anos com alerta")).map(esc),
  ].map(t => `<li>${t}</li>`).join("");
  $("fonte").innerHTML = `${esc(meta.fonte.nota)} Fonte: <a href="${esc(meta.fonte.url)}" rel="noopener">${esc(meta.fonte.nome)}, INEP</a>.
    Classificação: mapeamento v${esc(meta.classificacao.versao_mapeamento)}.
    <a href="${esc(API)}/methodology" rel="noopener">Metodologia completa</a>.`;
}

async function iniciar() {
  $("legenda").innerHTML = legendaHTML();
  try {
    anosInfo = (await api("/years")).data;
    const anos = anosInfo.filter(a => a.status === "disponivel").map(a => a.ano);
    if (!anos.length) throw new Error("a base não tem anos disponíveis.");
    const opcoes = anos.map(a => `<option value="${a}">${a}</option>`).join("");
    $("ano-ini").innerHTML = $("ano-fim").innerHTML = opcoes;
    $("ano-ini").value = anos[0];
    $("ano-fim").value = anos[anos.length - 1];
  } catch (e) { mostrarErro(e); return; }

  $("ano-ini").addEventListener("change", carregar);
  $("ano-fim").addEventListener("change", carregar);
  document.querySelectorAll("[data-filtro]").forEach(grupo => grupo.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    filtros[grupo.dataset.filtro] = b.value;
    grupo.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    carregar();
  }));
  let t;
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => dados && desenhar(), 150); });
  carregar();
}

iniciar();
</script>
</body>
</html>
