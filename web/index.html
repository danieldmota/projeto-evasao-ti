<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231f1b16%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22Georgia,serif%22 font-size=%2216%22 font-style=%22italic%22 fill=%22%23f7f5ef%22 text-anchor=%22middle%22%3ETI%3C/text%3E%3C/svg%3E">
<title>Permanência em TI</title>
<script src="tema.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap">
<link rel="stylesheet" href="estilo.css">
<script>
// Configuração da jornada (o resto fica em jornada.js)
window.JORNADA_CONFIG = {
  api: "/api/v1",                // endereço da API; dá para trocar com ?api=URL
  formulario: "formulario.html", // trocar pelo formulário oficial
  pontuacao: "pesos",            // "pesos" = demonstração; "api" = POST /vocational/submissions
  endpoints: { interesse: null }, // null = não envia nada
  mapaAreasParaDados: {},        // se as áreas do teste forem outras: { "codigo_do_teste": "TI" }
  projeto: {
    descricao: "É um projeto acadêmico de prevenção à evasão nos cursos de Tecnologia da Informação.", // [EDITAR]
    saibaMaisUrl: null,          // link oficial do projeto, quando existir
  },
};
</script>
</head>
<body class="jornada">
<a class="skip" href="#conteudo">Pular para o conteúdo</a>

<header class="j-top">
  <div class="j-top-inner">
    <a class="brand" href="#/inicio">Permanência <span>em TI</span></a>
    <div class="j-progress">
      <span class="j-progress-label" id="j-progress-label">Carregando…</span>
      <div class="j-progress-bar" id="j-progress-bar" aria-hidden="true"></div>
    </div>
    <div class="segmented theme-switch" role="group" aria-label="Tema da página">
      <button type="button" data-theme-set="auto" aria-pressed="true" title="Seguir o sistema">Auto</button>
      <button type="button" data-theme-set="light" aria-pressed="false">Claro</button>
      <button type="button" data-theme-set="dark" aria-pressed="false">Escuro</button>
    </div>
  </div>
</header>

<div class="j-layout">
  <nav class="j-rail" aria-label="Etapas da jornada">
    <h2>Sua jornada</h2>
    <ol class="j-steps" id="j-steps"></ol>
  </nav>

  <main id="conteudo" class="j-main" tabindex="-1">
    <div id="j-stage"></div>
    <p class="j-hint" id="j-hint" role="status" hidden></p>
    <div class="j-actions">
      <button type="button" class="btn ghost" id="j-back">Voltar</button>
      <button type="button" class="btn primary" id="j-next">Continuar</button>
    </div>
  </main>
</div>

<p class="visually-hidden" aria-live="polite" id="j-announce"></p>
<noscript><p class="page">Esta jornada precisa de JavaScript para funcionar.</p></noscript>

<script type="module" src="jornada.js"></script>

</html>
