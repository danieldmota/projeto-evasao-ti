/* ============================================================================
   CONFIGURAÇÃO DA JORNADA — único lugar que a equipe precisa editar.

window.JORNADA_CONFIG = {
  // API de estatísticas (evasao-ti serve). Pode ser sobrescrita com ?api=URL.
  api: "http://127.0.0.1:8000/api/v1",

  // HTML do formulário vocacional. Troque pelo arquivo oficial quando chegar
  // (veja o contrato no topo de formulario/formulario.html).
  formulario: "formulario/formulario.html",

  // "pesos": pontuação PROVISÓRIA com os data-pesos do HTML (mostra aviso de demonstração).
  // "api":   envia para POST {api}/vocational/submissions e exibe o VocationalResult.
  pontuacao: "pesos",

  // Endpoints de registro. null = modo demonstração (nada é enviado e a tela avisa).
  endpoints: {
    interesse: null,      // ex.: "https://servidor/api/v1/vocational/it-interest"
    participacao: null,   // ex.: "https://servidor/api/v1/participation"
  },

  // Se as áreas do questionário oficial forem diferentes das 5 áreas dos dados,
  // mapeie aqui para destacar a área certa nos gráficos: { "codigo_do_teste": "TI" }.
  mapaAreasParaDados: {},

  // Textos do convite (etapa 5). [EDITAR] com as informações oficiais do projeto.
  projeto: {
    descricao: "É um projeto de prevenção à evasão universitária em TI. Se você topar participar, a equipe poderá entrar em contato para explicar as próximas etapas.",
    finalidade: "Entrar em contato com você sobre este projeto. Seus dados não são usados para outro fim nem vendidos.",
    retencao: "Até o fim do projeto ou até você pedir a exclusão, o que vier primeiro.",
    politicaUrl: "#",                 // [EDITAR] link da política de privacidade publicada
    politicaVersao: "rascunho-0",     // [EDITAR] versão da política aceita no consentimento
    purposeCode: "contato_projeto_prevencao_evasao_ti",
  },
};
